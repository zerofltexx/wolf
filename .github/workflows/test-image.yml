# Builds a Wolf image from this branch so people can test Steam Input without
# building it themselves. Lives only on test-build/*, never on the PR branch.
#
#   docker pull ghcr.io/zerofltexx/wolf:steam-input
#
# amd64 only, matching what upstream publishes: the 32-bit shim the feature needs
# is built with g++ -m32, which is x86 only.
name: Test image

on:
  push:
    branches:
      - "test-build/**"
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr, so no PAT to manage
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wolf:steam-input
            ghcr.io/${{ github.repository_owner }}/wolf:steam-input-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/games-on-whales/gstreamer:1.26.7
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          # Without a cache a cold C++ build is roughly an hour on a free runner.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Test image pushed"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/wolf:steam-input"
            echo '```'
            echo
            echo "Built from \`${{ github.sha }}\` on \`${{ github.ref_name }}\`."
            echo "Set \`WOLF_FAKE_UINPUT=1\` in the Steam app's runner env to enable the shim."
          } >> "$GITHUB_STEP_SUMMARY"
